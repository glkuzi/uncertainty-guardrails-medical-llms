hydra:
  run:
    dir: ${output_dir}/train/${now:%Y-%m-%d}/${now:%H-%M-%S}

model:
  pretrained_model_name_or_path: mistralai/Mistral-7B-Instruct-v0.2
  device_map: cuda
  trust_remote_code: true
  torch_dtype: "torch.float16"

ue_layer:
  path: ""
  pos_weight: 4.0
  output_attention: true
  head_cfg:
    head_type: "luh"
    feature_extractor:
      - name: luq.feature_extractors.basic_hidden_states
        layer_nums: [-1]
      - name: luq.feature_extractors.final_output_ranks
    uncertainty_head:
      dropout: 0.0
      enable_feature_projection_layer: false
      use_transformer_encoder: false

dataset:
  path: "hf:llm-uncertainty-head/train_akimbio_mistral"
  num_instances: 0
  test_size: 0.

training_arguments:
  num_train_epochs: 2
  learning_rate: 1e-2
  warmup_ratio: 0.
  weight_decay: 0.1
  gradient_accumulation_steps: 7
  per_device_train_batch_size: 4
  max_grad_norm: 1.

do_train: true
do_eval: true
do_hyperopt: false
do_save_checkpoints: false
do_save_final_model: true

report_to: wandb

output_dir: ./workdir
