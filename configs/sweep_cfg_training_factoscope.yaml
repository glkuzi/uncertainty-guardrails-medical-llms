program: train_luq/run_train_luq.py
method: bayes
metric:
  name: eval/f1
  goal: maximize
parameters:
  training_arguments.learning_rate:
      values: [5e-4, 1e-4, 5e-5, 1e-5]
  training_arguments.warmup_ratio:
      values: [0.0, 0.05, 0.1]
  training_arguments.num_train_epochs:
      values: [2, 3, 4, 5, 6]
  ue_layer.head_cfg.uncertainty_head.n_layers:
        values: [1, 2]
  ue_layer.head_cfg.uncertainty_head.n_heads:
        values: [16, 32, 64]
  ue_layer.head_cfg.uncertainty_head.interim_dim:
      values: [512, 1024, 2048]
  ue_layer.head_cfg.uncertainty_head.head_dim:
      values: [512, 1024, 2048, 4096]
  ue_layer.pos_weight: 
      values: [4, 5, 6, 7]
  ue_layer.head_cfg.feature_extractor.0.layer_nums:
      values: ["all", [-2, -1], [-4, -3, -2, -1], [-8, -7, -6, -5, -4, -3, -2, -1]]
  ue_layer.head_cfg.feature_extractor.1.layer_nums:
      values: ["all", [-2, -1], [-4, -3, -2, -1], [-8, -7, -6, -5, -4, -3, -2, -1]]
  ue_layer.head_cfg.feature_extractor.2.layer_nums:
      values: ["all", [-2, -1], [-4, -3, -2, -1], [-8, -7, -6, -5, -4, -3, -2, -1]]
  ue_layer.head_cfg.feature_extractor.3.layer_nums:
      values: [[-1], [-1, -5], [-1, -5, -16]]
command:
  - ${interpreter}
  - ${program}
  - --config-path=../configs
  - --config-name=run_train_luq_factoscope.yaml
  - ${args_no_hyphens}
