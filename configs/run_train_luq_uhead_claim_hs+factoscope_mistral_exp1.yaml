model:
  pretrained_model_name_or_path: mistralai/Mistral-7B-Instruct-v0.2
  device_map: cuda
  trust_remote_code: true
  torch_dtype: torch.float16
ue_layer:
  path: ''
  pos_weight: 5
  output_attention: true
  head_cfg:
    head_type: claim
    uncertainty_head:
      head_dim: 512
      n_layers: 1
      n_heads: 16
      dropout: 0.2
    feature_extractor:
    - name: luh.feature_extractors.basic_hidden_states
      layer_nums:
      - -1
    - name: luh.feature_extractors.token_similarities_adjacent_layers
      layer_nums:
      - -30
      - -25
      - -20
      - -15
      - -10
      - -5
      - -2
      - -1
      top_n: 10
    - name: luh.feature_extractors.token_probabilities_from_layers
      layer_nums:
      - -30
      - -25
      - -20
      - -15
      - -10
      - -5
      - -2
      - -1
      top_n: 10
    - name: luh.feature_extractors.final_output_ranks
      layer_nums: all
dataset:
  path: hf:llm-uncertainty-head/train_akimbio_mistral
  num_instances: 0
  test_size: 0.0
  validation: eval
training_arguments:
  num_train_epochs: 3
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.1
  gradient_accumulation_steps: 1
  per_device_train_batch_size: 32
  max_grad_norm: 1.0
do_train: true
do_eval: true
do_hyperopt: false
do_save_checkpoints: false
do_save_final_model: true
report_to: wandb
output_dir: ./workdir
do_predict: false