model:
  pretrained_model_name_or_path: google/gemma-2-9b-it
  device_map: cuda
  trust_remote_code: true
  torch_dtype: torch.float16
ue_layer:
  path: ''
  pos_weight: 4
  output_attention: true
  head_cfg:
    head_type: claim
    feature_extractor:
    - name: luh.feature_extractors.lookback_lens
    uncertainty_head:
      head_dim: 256
      n_layers: 1
      n_heads: 8
      dropout: 0.2
dataset:
  path: hf:llm-uncertainty-head/train_akimbio_gemma2
  num_instances: 0
  test_size: 0.0
  validation: eval
training_arguments:
  num_train_epochs: 2
  learning_rate: 5.0e-05
  warmup_ratio: 0.05
  weight_decay: 0.1
  gradient_accumulation_steps: 16
  per_device_train_batch_size: 2
  max_grad_norm: 1.0
do_train: true
do_eval: true
do_hyperopt: false
do_save_checkpoints: false
do_save_final_model: true
report_to: wandb
output_dir: ./workdir
do_predict: false