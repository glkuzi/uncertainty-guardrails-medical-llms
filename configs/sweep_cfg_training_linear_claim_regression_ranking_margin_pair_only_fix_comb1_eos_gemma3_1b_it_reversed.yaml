# sweep_config.yaml
program: train_luh/run_train_luh.py  # The script you want to execute
method: bayes
metric:
  name: eval/prr
  goal: maximize
parameters:
  training_arguments.learning_rate:
      values: [1e-1, 1e-2, 1e-3, 2e-4, 1e-4, 5e-5, 3e-5]
  training_arguments.warmup_ratio:
      values: [0.0, 0.05, 0.1]
  training_arguments.num_train_epochs:
      values: [2, 3, 4, 5, 10, 13]
  ue_layer.ue_rank_margin:
      values: [0.0, 0.2, 0.5, 0.8, 1.0, 2.0, 5.0]
  ue_layer.head_cfg.feature_extractor.1.attn_history_sz:
      values: [1, 2, 3, 5, 10]
command:
  - ${interpreter}
  - ${program}
  - --config-path=../configs
  - --config-name=run_train_base_luq_linear_claim_regression_for_sweep.yaml
  - model.pretrained_model_name_or_path="google/gemma-3-1b-it"
  - +model.attn_implementation="eager"
  - dataset.path="../newly_builded_datasets/polygraph_data_until_eos/gemma3-1b-it/sciq_triqa_truqa_with_val_reversed"
  - ue_layer.legacy_rank_calc=False
  - ue_layer.margin_loss=True
  - ue_layer.ue_ranking=1.0
  - ue_layer.pairwise=True
  - ${args_no_hyphens}
