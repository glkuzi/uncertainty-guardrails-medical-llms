hydra:
  run:
    dir: ${cache_path}/${task}/${model.path}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: causal_lm

task: bio
dataset: ['llm-uncertainty-head/train_akimbio_mistral']
text_column: question
eval_split: test
load_from_disk: false
subsample_eval_dataset: -1
use_claim_ue: true
generation_params:
  stop_strings:
    - "<|eot_id|>"


generation_metrics: [{
  'name': 'AlignScore',
  'args': {},
}]

estimators:
  - name: RandomBaselineClaim
  - name: MaximumClaimProbability

stat_calculators:
  - auto
  - name: ClaimExtractor
    builder: lm_polygraph.defaults.stat_calculator_builders.default_ClaimsExtractor
    cfg:
      openai_model: "gpt-4o"
      cache_path: "./workdir/cache"
      sent_separators: ""
      language: "en"
      n_threads: 1
      mock_model: true
    stats: 
      - "claims"
      - "claim_texts_concatenated"
      - "claim_input_texts_concatenated"
    dependencies:
      - "greedy_texts"
      - "greedy_tokens"

max_new_tokens: 256
ignore_exceptions: false
language: en
batch_size: 1
seed:
    - 1
cache_path: ./workdir/cache
save_path: '${hydra:run.dir}'
report_to_wandb: true

n_threads: 1
log_time: true
