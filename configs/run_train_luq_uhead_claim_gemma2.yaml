model:
  pretrained_model_name_or_path: google/gemma-2-9b-it
  device_map: cuda
  trust_remote_code: true
  torch_dtype: torch.float16
ue_layer:
  path: ''
  pos_weight: 4
  output_attention: true
  head_cfg:
    head_type: claim
    feature_extractor:
    - name: luh.feature_extractors.lookback_lens
    - name: luh.feature_extractors.basic_hidden_states
      layer_nums:
      - -1
      - -15
      - -30
    - name: luh.feature_extractors.basic_attention
      layer_nums:
      - -1
      - -2
      - -3
      - -4
      - -5
      - -10
      - -15
      - -20
      - -25
      - -30
      attn_history_sz: 2
      pool: false
    # - name: luq.feature_extractors.token_probabilities
    #   top_n: 4
    # - name: luq.feature_extractors.token_similarities_adjacent_layers
    #   layer_nums: all
    #   top_n: 10
    # - name: luq.feature_extractors.token_probabilities_from_layers
    #   layer_nums: all
    #   top_n: 10
    # - name: luq.feature_extractors.final_output_ranks
    #   layer_nums: all
    uncertainty_head:
      head_dim: 256
      n_layers: 1
      n_heads: 8
      dropout: 0.2
dataset:
  path: hf:llm-uncertainty-head/train_akimbio_gemma2
  #path: /home/artemshelmanov/workspace/projects/luq-prod/workdir/extract_verify/2025-02-07/15-11-04/result
  #path: /home/artemshelmanov/workspace/projects/luq-prod/workdir/extract_verify/2025-02-07/17-29-48/result
  num_instances: 0
  test_size: 0.0
  validation: eval
training_arguments:
  num_train_epochs: 5
  learning_rate: 1.0e-04
  warmup_ratio: 0.1
  weight_decay: 0.1
  #gradient_accumulation_steps: 7
  gradient_accumulation_steps: 2
  per_device_train_batch_size: 16
  max_grad_norm: 1.0
do_train: true
do_eval: true
do_hyperopt: false
do_save_checkpoints: false
do_save_final_model: true
report_to: wandb
output_dir: ./workdir
do_predict: false