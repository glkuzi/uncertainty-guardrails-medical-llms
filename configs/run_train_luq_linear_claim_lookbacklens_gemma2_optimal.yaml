model:
  pretrained_model_name_or_path: google/gemma-2-9b-it
  device_map: cuda
  trust_remote_code: true
  torch_dtype: torch.float16
ue_layer:
  path: ''
  pos_weight: 3
  output_attention: true
  head_cfg:
    head_type: linear_claim
    feature_extractor:
    - name: luq.feature_extractors.lookback_lens
    uncertainty_head: null
dataset:
  path: hf:llm-uncertainty-head/train_akimbio_gemma2
  num_instances: 0
  test_size: 0.0
training_arguments:
  num_train_epochs: 13
  learning_rate: 0.01
  warmup_ratio: 0.1
  weight_decay: 0.1
  gradient_accumulation_steps: 2
  per_device_train_batch_size: 16
  max_grad_norm: 1.0
do_train: true
do_eval: true
do_hyperopt: false
do_save_checkpoints: true
do_save_final_model: true
do_predict: false
report_to: wandb
output_dir: ./workdir
