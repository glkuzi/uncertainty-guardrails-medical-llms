model:
  pretrained_model_name_or_path: mistralai/Mistral-7B-Instruct-v0.2
  device_map: cuda
  trust_remote_code: true
  torch_dtype: torch.float16
ue_layer:
  path: ''
  pos_weight: 4
  output_attention: true
  head_cfg:
    head_type: claim
    feature_extractor:
    - name: luq.feature_extractors.lookback_lens
    - name: luq.feature_extractors.basic_hidden_states
      layer_nums:
      - -1
      - -5
      - -15
      - -30
    - name: luq.feature_extractors.basic_attention
      layer_nums:
      - -1
      - -2
      - -3
      - -4
      - -5
      - -10
      - -15
      - -20
      - -25
      - -30
      attn_history_sz: 2
      pool: false
    - name: luq.feature_extractors.token_probabilities
      top_n: 4
    uncertainty_head:
      head_dim: 256
      n_layers: 1
      n_heads: 8
      dropout: 0.2
dataset:
  path: hf:llm-uncertainty-head/train_akimbio_mistral
  #path: /home/artemshelmanov/workspace/projects/luq-prod/workdir/extract_verify/2025-02-07/15-11-04/result
  #path: /home/artemshelmanov/workspace/projects/luq-prod/workdir/extract_verify/2025-02-07/17-29-48/result
  num_instances: 0
  test_size: 0.0
  validation: eval
training_arguments:
  num_train_epochs: 2
  learning_rate: 5.0e-05
  warmup_ratio: 0.05
  weight_decay: 0.1
  #gradient_accumulation_steps: 7
  gradient_accumulation_steps: 1
  per_device_train_batch_size: 32
  max_grad_norm: 1.0
do_train: true
do_eval: true
do_hyperopt: false
do_save_checkpoints: false
do_save_final_model: true
report_to: wandb
output_dir: ./workdir
do_predict: false